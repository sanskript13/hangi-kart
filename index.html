<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111111">
<title>Hangi Kart?</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    transition: background 0.4s;
  }
  body.enpara { background: #f5f5f5; color: #1a1a1a; }
  body.ykb { background: #1a0a2e; color: #fff; }

  .card {
    width: 100%;
    max-width: 340px;
    aspect-ratio: 1.586;
    border-radius: 16px;
    padding: 1.75rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    transition: all 0.4s;
  }
  .enpara .card {
    background: #fff;
    border: 1px solid #e0e0e0;
    color: #1a1a1a;
  }
  .ykb .card {
    background: linear-gradient(135deg, #5c1a7a, #3a0d54);
    border: 1px solid #7b3a96;
    color: #fff;
  }

  .chip {
    width: 40px;
    height: 30px;
    border-radius: 6px;
    position: absolute;
    top: 1.75rem;
    right: 1.75rem;
  }
  .enpara .chip { background: #e0e0e0; border: 1px solid #ccc; }
  .ykb .chip { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2); }

  .bank-name {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.5;
  }
  .card-label {
    font-size: 24px;
    font-weight: 600;
    margin-top: 4px;
  }
  .enpara .card-label { color: #333; }
  .ykb .card-label { color: #e8d0f5; }

  .card-dots {
    font-family: 'SF Mono', 'Menlo', monospace;
    font-size: 15px;
    letter-spacing: 3px;
    opacity: 0.4;
  }

  .info {
    text-align: center;
    margin-top: 2rem;
    width: 100%;
    max-width: 340px;
  }
  .info-label {
    font-size: 13px;
    opacity: 0.5;
    margin-bottom: 4px;
  }
  .info-name {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 1.25rem;
  }

  .days-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    border-radius: 100px;
    font-size: 15px;
    margin-bottom: 1.5rem;
  }
  .enpara .days-badge { background: rgba(0,0,0,0.06); }
  .ykb .days-badge { background: rgba(255,255,255,0.1); }
  .days-badge strong { font-weight: 600; }

  .progress-wrap { width: 100%; max-width: 280px; margin: 0 auto; }
  .progress-bar {
    height: 4px;
    border-radius: 2px;
    overflow: hidden;
  }
  .enpara .progress-bar { background: rgba(0,0,0,0.08); }
  .ykb .progress-bar { background: rgba(255,255,255,0.1); }
  .progress-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.5s ease;
  }
  .enpara .progress-fill { background: #888; }
  .ykb .progress-fill { background: #b47dd4; }

  .progress-labels {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    opacity: 0.4;
    margin-top: 6px;
  }

  .today {
    font-size: 13px;
    opacity: 0.4;
    margin-top: 1.5rem;
  }
</style>
</head>
<body>

<div class="card">
  <div class="chip"></div>
  <div>
    <div class="bank-name" id="bank-name"></div>
    <div class="card-label" id="card-label"></div>
  </div>
  <div class="card-dots">····  ····  ····  ····</div>
</div>

<div class="info">
  <div class="info-label">Bug&uuml;n kullan&#305;lacak kart</div>
  <div class="info-name" id="info-name"></div>

  <div class="days-badge">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    <span id="days-text"></span>
  </div>

  <div class="progress-wrap">
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <div class="progress-labels">
      <span id="p-start"></span>
      <span id="p-end"></span>
    </div>
  </div>

  <div class="today" id="today"></div>
</div>

<script>
(function() {
  var now = new Date();
  var day = now.getDate();
  var month = now.getMonth();
  var year = now.getFullYear();
  var isEnpara = day >= 16 && day <= 25;

  document.body.className = isEnpara ? 'enpara' : 'ykb';
  document.getElementById('bank-name').textContent = isEnpara ? 'QNB Finansbank' : 'Yapı Kredi';
  document.getElementById('card-label').textContent = isEnpara ? 'Enpara' : 'World';
  document.getElementById('info-name').textContent = isEnpara ? 'Enpara' : 'Yapı Kredi';

  var remaining, totalDays, elapsed;

  if (isEnpara) {
    totalDays = 10;
    elapsed = day - 16 + 1;
    remaining = 25 - day;
    document.getElementById('p-start').textContent = '16';
    document.getElementById('p-end').textContent = '25';
  } else {
    if (day >= 26) {
      var lastDay = new Date(year, month + 1, 0).getDate();
      totalDays = (lastDay - 26) + 15 + 1;
      elapsed = day - 26 + 1;
      remaining = totalDays - elapsed;
    } else {
      var prevLastDay = new Date(year, month, 0).getDate();
      totalDays = (prevLastDay - 26) + 15 + 1;
      elapsed = (prevLastDay - 26) + day + 1;
      remaining = 15 - day;
    }
    document.getElementById('p-start').textContent = '26';
    document.getElementById('p-end').textContent = '15';
  }

  var daysText = document.getElementById('days-text');
  if (remaining === 0) {
    daysText.innerHTML = '<strong>Son gün!</strong>';
  } else {
    daysText.innerHTML = 'Kalan: <strong>' + remaining + '</strong> gün';
  }
  var pct = Math.min(100, Math.round((elapsed / totalDays) * 100));
  document.getElementById('progress-fill').style.width = pct + '%';

  var months = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  document.getElementById('today').textContent = day + ' ' + months[month] + ' ' + year;
})();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}
</script>
</body>
</html>
